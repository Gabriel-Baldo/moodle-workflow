<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moodle Workflow — Chat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; padding: 2rem; }
  h1 { color: #e94560; margin-bottom: 1rem; }
  .card { background: #16213e; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; }
  button { background: #e94560; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
  button:hover { background: #c73e54; }
  .chat { height: 400px; overflow-y: auto; background: #0f3460; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
  .msg { margin-bottom: 0.75rem; padding: 0.5rem; border-radius: 6px; }
  .user { background: #e94560; color: #fff; margin-left: 2rem; }
  .bot { background: #1a1a2e; color: #eee; margin-right: 2rem; }
  .chat-input { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  textarea { flex: 1; min-width: 200px; background: #0f3460; color: #eee; border: 1px solid #333; padding: 0.5rem; border-radius: 4px; resize: vertical; min-height: 40px; }
  .file-label { background: #0f3460; color: #eee; border: 1px solid #333; padding: 0.5rem; border-radius: 4px; cursor: pointer; }
  .file-label:hover { background: #1a1a2e; }
  #fileInfo { font-size: 0.85rem; color: #4ecca3; }
  pre { background: #0f3460; padding: 1rem; border-radius: 4px; overflow-x: auto; margin-top: 1rem; white-space: pre-wrap; }
  .ok { color: #4ecca3; }
  .err { color: #e94560; }
  input, select { background: #0f3460; color: #eee; border: 1px solid #333; padding: 0.5rem; border-radius: 4px; }
</style>
</head>
<body>
<h1>💬 Chat — Moodle Workflow</h1>
<div class="card">
  <h2>Conversa</h2>
  <div class="chat" id="chat"></div>
  <div class="chat-input">
    <label class="file-label">
      📎 Arquivo
      <input type="file" id="fileInput" style="display:none" onchange="showFile()">
    </label>
    <span id="fileInfo"></span>
    <textarea id="msg" rows="1" placeholder="Escreva seu prompt..."></textarea>
    <button onclick="send()">Enviar</button>
  </div>
</div>
<div class="card">
  <h2>Status</h2>
  <button onclick="checkHealth()">Verificar conexão</button>
  <pre id="status"></pre>
</div>
<script>
const API = '';
const chat = document.getElementById('chat');
const msgInput = document.getElementById('msg');
const fileInput = document.getElementById('fileInput');
const fileInfo = document.getElementById('fileInfo');

function addMsg(text, role) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function showFile() {
  fileInfo.textContent = fileInput.files[0]?.name || '';
}

async function send() {
  const text = msgInput.value.trim();
  const file = fileInput.files[0];
  if (!text && !file) return;
  addMsg(text || '(sem texto)', 'user');
  msgInput.value = '';
  const fd = new FormData();
  fd.append('message', text);
  if (file) fd.append('file', file);
  try {
    const r = await fetch(API + '/chat', { method: 'POST', body: fd });
    const d = await r.json();
    addMsg(d.response || 'Sem resposta', 'bot');
    fileInfo.textContent = '';
    fileInput.value = '';
  } catch (e) {
    addMsg('Erro: ' + e.message, 'bot');
  }
}

async function checkHealth() {
  try {
    const r = await fetch(API + '/health');
    const d = await r.json();
    document.getElementById('status').textContent = JSON.stringify(d, null, 2);
    document.getElementById('status').className = 'ok';
  } catch (e) {
    document.getElementById('status').textContent = 'Erro: ' + e.message;
    document.getElementById('status').className = 'err';
  }
}

msgInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
</script>
</body>
</html>
